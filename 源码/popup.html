<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #333;
    }
    button {
      background-color: #10a37f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0d8a6a;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      word-break: break-all;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      font-size: 11px;
      box-sizing: border-box;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Codex 账号提取</h3>
  <button id="extractBtn">一键提取并复制</button>
  <div id="status">请在 ChatGPT 页面点击提取</div>
  <textarea id="fallbackTextarea"></textarea>

  <script src="popup.js"></script>
</body>
</html>
