<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地支付长链生成器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --ink: #161b22;
        --muted: #667085;
        --line: #d9dee7;
        --soft: #eef3f7;
        --accent: #087443;
        --accent-dark: #075f38;
        --blue: #155eef;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 36px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: end;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(92px, 1fr));
        gap: 8px;
        min-width: 320px;
      }

      .stat {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .stat strong {
        display: block;
        font-size: 18px;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
      }

      .tool {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 700;
      }

      textarea,
      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 180px;
        resize: vertical;
      }

      textarea:focus,
      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(8, 116, 67, 0.14);
      }

      .token-meta {
        min-height: 22px;
        color: var(--muted);
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      details {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 14px;
      }

      .actions,
      .result-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      button,
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a.button:hover {
        background: var(--accent-dark);
      }

      button.secondary,
      a.button.secondary {
        background: var(--soft);
        color: var(--ink);
      }

      button.secondary:hover,
      a.button.secondary:hover {
        background: #e1e8ee;
      }

      a.button.blue {
        background: var(--blue);
      }

      a.button.blue:hover {
        background: #114ac0;
      }

      button:disabled,
      a.button.disabled {
        pointer-events: none;
        cursor: wait;
        opacity: 0.62;
      }

      .status {
        min-height: 24px;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .result {
        display: none;
        margin-top: 2px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .result.show {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        gap: 6px;
      }

      code {
        display: block;
        overflow-wrap: anywhere;
        padding: 12px;
        border-radius: 6px;
        background: var(--soft);
        color: #101828;
        line-height: 1.45;
      }

      @media (max-width: 840px) {
        main {
          width: min(100vw - 24px, 980px);
          padding: 24px 0;
        }

        header {
          display: grid;
          align-items: start;
        }

        h1 {
          font-size: 25px;
        }

        .stats {
          min-width: 0;
          width: 100%;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>本地支付长链生成器</h1>
          <p>地区下拉，币种自动跟随，支付页语言可选。</p>
        </div>
        <div class="stats" aria-label="local stats">
          <div class="stat">
            <strong>本地</strong>
            <span>Token 不保存</span>
          </div>
          <div class="stat">
            <strong>长链</strong>
            <span>pay.openai.com</span>
          </div>
          <div class="stat">
            <strong>Plus</strong>
            <span>hosted</span>
          </div>
        </div>
      </header>

      <section class="tool">
        <div>
          <label for="accessToken">Access Token 或 session JSON</label>
          <textarea id="accessToken" autocomplete="off" spellcheck="false"></textarea>
          <div id="tokenMeta" class="token-meta"></div>
        </div>

        <div class="grid">
          <div>
            <label for="linkType">链类型</label>
            <select id="linkType">
              <option value="hosted">支付长链（默认美国）</option>
              <option value="paypal" selected>PP 链提取（日本地址）</option>
              <option value="gopay">GoPay 链提取（印尼地址）</option>
            </select>
          </div>
          <div>
            <label for="checkoutMode">支付页模式</label>
            <select id="checkoutMode">
              <option value="hosted" selected>hosted: pay.openai.com 长链</option>
            </select>
          </div>
          <div>
            <label for="paymentLocale">支付页语言</label>
            <select id="paymentLocale">
              <option value="en" selected>英文</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁体中文</option>
              <option value="ja">日文</option>
              <option value="ko">韩文</option>
              <option value="de">德文</option>
              <option value="fr">法文</option>
              <option value="es">西班牙文</option>
              <option value="id">印尼文</option>
              <option value="pt-BR">葡萄牙文</option>
            </select>
          </div>
          <div>
            <label for="billingCountry">地区</label>
            <select id="billingCountry"></select>
          </div>
          <div>
            <label for="currency">币种</label>
            <input id="currency" readonly />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="checkoutProxy">创建代理（日本）支持 HTTP/SOCKS</label>
            <div style="display: flex; gap: 8px;">
              <input id="checkoutProxy" placeholder="socks5://127.0.0.1:7897" style="flex: 1;" />
              <button id="testCheckoutProxy" class="secondary" type="button" style="min-width: 100px;">测试代理</button>
            </div>
          </div>
          <div>
            <label for="approvalProxy">审批代理（美国）支持 HTTP/SOCKS</label>
            <div style="display: flex; gap: 8px;">
              <input id="approvalProxy" placeholder="http://127.0.0.1:7080" style="flex: 1;" />
              <button id="testApprovalProxy" class="secondary" type="button" style="min-width: 100px;">测试代理</button>
            </div>
          </div>
          <div>
            <label for="paymentProxy">支付代理（美国）支持 HTTP/SOCKS</label>
            <div style="display: flex; gap: 8px;">
              <input id="paymentProxy" placeholder="socks5://127.0.0.1:7090" style="flex: 1;" />
              <button id="testPaymentProxy" class="secondary" type="button" style="min-width: 100px;">测试代理</button>
            </div>
          </div>
        </div>

        <details>
          <summary>高级选项</summary>
          <div class="grid">
            <div>
              <label for="stripeKey">Stripe Publishable Key</label>
              <input id="stripeKey" placeholder="pk_live_..." />
            </div>
            <div>
              <label for="deviceId">Device ID</label>
              <input id="deviceId" placeholder="留空自动生成" />
            </div>
            <div>
              <label for="userAgent">User Agent</label>
              <input id="userAgent" placeholder="留空使用默认 Chrome UA" />
            </div>
          </div>
        </details>

        <div class="actions">
          <button id="generate">生成支付长链</button>
          <button id="saveProxy" class="secondary" type="button">保存代理</button>
          <button id="clearProxy" class="secondary" type="button">清除保存</button>
          <span id="status" class="status">代理未检测。</span>
        </div>

        <div id="logsRow" class="row" style="display: none; margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd;">
          <label>实时日志</label>
          <div id="logsContainer" style="max-height: 300px; overflow-y: auto; background: #f8f9fa; padding: 8px; border-radius: 4px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.6;"></div>
        </div>

        <div id="result" class="result">
          <div class="result-actions">
            <a id="openLink" class="button blue disabled" target="_blank" rel="noopener">跳转长链</a>
            <button id="copy" class="secondary" type="button" disabled>复制长链</button>
          </div>
          <div class="row">
            <label>长链</label>
            <code id="longUrl"></code>
          </div>
          <div class="row">
            <label>CS ID / 地区 / 币种</label>
            <code id="summary"></code>
          </div>
          <div class="row">
            <label>提取状态</label>
            <code id="extractStatus"></code>
          </div>
          <div class="row">
            <label>Provider Redirect URL</label>
            <code id="providerUrl"></code>
          </div>
          <div class="row">
            <label>Stripe Redirect URL</label>
            <code id="stripeRedirectUrl"></code>
          </div>
          <div class="row">
            <label>原始 Stripe URL</label>
            <code id="stripeUrl"></code>
          </div>
        </div>
      </section>
    </main>

    <script>
      const COUNTRIES = [
        ["US", "美国 US", "USD"],
        ["GB", "英国 GB", "GBP"],
        ["CA", "加拿大 CA", "CAD"],
        ["AU", "澳大利亚 AU", "AUD"],
        ["JP", "日本 JP", "JPY"],
        ["SG", "新加坡 SG", "SGD"],
        ["HK", "中国香港 HK", "HKD"],
        ["TW", "中国台湾 TW", "TWD"],
        ["KR", "韩国 KR", "KRW"],
        ["ID", "印度尼西亚 ID", "IDR"],
        ["MY", "马来西亚 MY", "MYR"],
        ["TH", "泰国 TH", "THB"],
        ["VN", "越南 VN", "VND"],
        ["PH", "菲律宾 PH", "PHP"],
        ["IN", "印度 IN", "INR"],
        ["DE", "德国 DE", "EUR"],
        ["FR", "法国 FR", "EUR"],
        ["IT", "意大利 IT", "EUR"],
        ["ES", "西班牙 ES", "EUR"],
        ["NL", "荷兰 NL", "EUR"],
        ["IE", "爱尔兰 IE", "EUR"],
        ["PT", "葡萄牙 PT", "EUR"],
        ["BE", "比利时 BE", "EUR"],
        ["FI", "芬兰 FI", "EUR"],
        ["AT", "奥地利 AT", "EUR"],
        ["CH", "瑞士 CH", "CHF"],
        ["SE", "瑞典 SE", "SEK"],
        ["NO", "挪威 NO", "NOK"],
        ["DK", "丹麦 DK", "DKK"],
        ["PL", "波兰 PL", "PLN"],
        ["CZ", "捷克 CZ", "CZK"],
        ["MX", "墨西哥 MX", "MXN"],
        ["BR", "巴西 BR", "BRL"],
        ["NZ", "新西兰 NZ", "NZD"],
      ];

      const $ = (id) => document.getElementById(id);
      const LOCKED_COUNTRY_BY_TYPE = {
        hosted: "US",
        paypal: "US",
        gopay: "ID",
      };
      const generateButton = $("generate");
      const copyButton = $("copy");
      const openLink = $("openLink");
      const statusLine = $("status");
      let currentLongUrl = "";
      let pollingInterval = null;
      let lastLogCount = 0;

      function setStatus(text, isError = false) {
        statusLine.textContent = text;
        statusLine.classList.toggle("error", isError);
      }

      function base64UrlDecode(value) {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
        return decodeURIComponent(
          atob(padded)
            .split("")
            .map((char) => "%" + ("00" + char.charCodeAt(0).toString(16)).slice(-2))
            .join(""),
        );
      }

      function findToken(value) {
        if (!value) return "";
        if (typeof value === "string") return value.trim();
        if (Array.isArray(value)) {
          for (const item of value) {
            const token = findToken(item);
            if (token) return token;
          }
        }
        if (typeof value === "object") {
          for (const key of ["accessToken", "access_token", "token"]) {
            if (typeof value[key] === "string" && value[key].trim()) return value[key].trim();
          }
          for (const item of Object.values(value)) {
            const token = findToken(item);
            if (token) return token;
          }
        }
        return "";
      }

      function readAccessTokenInput() {
        const raw = $("accessToken").value.trim();
        if (!raw) return "";
        if (raw.startsWith("{") || raw.startsWith("[")) {
          try {
            return findToken(JSON.parse(raw)) || raw;
          } catch {
            return raw;
          }
        }
        return raw;
      }

      function updateTokenMeta() {
        const token = readAccessTokenInput();
        if (!token.includes(".")) {
          $("tokenMeta").textContent = "";
          return;
        }
        try {
          const payload = JSON.parse(base64UrlDecode(token.split(".")[1] || ""));
          const profile = payload["https://api.openai.com/profile"] || {};
          const email = profile.email || payload.email || "";
          $("tokenMeta").textContent = email ? `已识别 token，可能关联邮箱：${email}` : "已识别 token";
        } catch {
          $("tokenMeta").textContent = "";
        }
      }

      function fillCountries() {
        const select = $("billingCountry");
        select.innerHTML = "";
        for (const [code, label] of COUNTRIES) {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = label;
          if (code === "US") option.selected = true;
          select.appendChild(option);
        }
      }

      function updateCurrency() {
        const selected = COUNTRIES.find(([code]) => code === $("billingCountry").value);
        $("currency").value = selected ? selected[2] : "USD";
      }

      function updateLockedCountry() {
        const linkType = $("linkType").value;
        const lockedCountry = LOCKED_COUNTRY_BY_TYPE[linkType] || "US";
        if (linkType === "hosted") {
          $("billingCountry").disabled = false;
          if (!$("billingCountry").value) $("billingCountry").value = "US";
        } else {
          $("billingCountry").value = lockedCountry;
          $("billingCountry").disabled = true;
        }
        updateCurrency();
        generateButton.textContent =
          linkType === "paypal" ? "提取 PP 链" : linkType === "gopay" ? "提取 GoPay 链" : "生成支付长链";
      }

      function loadProxy() {
        const savedCheckout = localStorage.getItem("openai_pay_checkout_proxy") || "";
        const savedApproval = localStorage.getItem("openai_pay_approval_proxy") || "";
        const savedPayment = localStorage.getItem("openai_pay_payment_proxy") || "";
        $("checkoutProxy").value = savedCheckout;
        $("approvalProxy").value = savedApproval;
        $("paymentProxy").value = savedPayment;
      }

      function setLinkEnabled(enabled) {
        copyButton.disabled = !enabled;
        openLink.classList.toggle("disabled", !enabled);
        openLink.href = enabled ? currentLongUrl : "";
      }

      async function generate() {
        const accessToken = readAccessTokenInput();
        if (!accessToken) {
          setStatus("Access Token 不能为空。", true);
          return;
        }

        generateButton.disabled = true;
        setLinkEnabled(false);
        $("result").classList.remove("show");
        setStatus("正在启动任务...");

        // 清空日志
        const logsContainer = $("logsContainer");
        logsContainer.innerHTML = "";
        $("logsRow").style.display = "block";
        lastLogCount = 0;

        // 清除之前的轮询
        if (pollingInterval) {
          clearInterval(pollingInterval);
          pollingInterval = null;
        }

        try {
          // 步骤 1: 启动异步任务
          const startResponse = await fetch("/api/long-link-async", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              accessToken,
              link_type: $("linkType").value,
              checkout_proxy: $("checkoutProxy").value.trim(),  // 创建代理（日本）
              approval_proxy: $("approvalProxy").value.trim(),  // 审批代理（美国）
              payment_proxy: $("paymentProxy").value.trim(),    // 支付代理（日本）
              billing_country: $("billingCountry").value,
              checkout_ui_mode: $("checkoutMode").value,
              payment_locale: $("paymentLocale").value,
              stripe_publishable_key: $("stripeKey").value.trim(),
              device_id: $("deviceId").value.trim(),
              user_agent: $("userAgent").value.trim(),
            }),
          });

          if (!startResponse.ok) {
            throw new Error("启动任务失败");
          }

          const { task_id } = await startResponse.json();
          setStatus("正在生成...");

          // 步骤 2: 开始轮询任务状态
          pollingInterval = setInterval(async () => {
            try {
              const statusResponse = await fetch(`/api/task-status/${task_id}`);
              if (!statusResponse.ok) {
                throw new Error("获取任务状态失败");
              }

              const data = await statusResponse.json();

              // 显示新日志
              if (data.logs && data.logs.length > lastLogCount) {
                for (let i = lastLogCount; i < data.logs.length; i++) {
                  appendLog(data.logs[i]);
                }
                lastLogCount = data.logs.length;
              }

              // 检查任务是否完成
              if (data.status === "completed") {
                clearInterval(pollingInterval);
                pollingInterval = null;

                // 显示结果
                const result = data.result;
                currentLongUrl = result.long_url || "";
                $("longUrl").textContent = currentLongUrl;
                $("summary").textContent = `${result.cs_id || ""} / ${result.billing_country || ""} / ${
                  result.currency || ""
                } / ${result.link_type || ""}`;
                $("extractStatus").textContent = result.fallback
                  ? `已回退 hosted：${result.provider_error || "provider redirect 提取失败"}`
                  : "OK";
                $("providerUrl").textContent = result.provider_redirect_url || "";
                $("stripeRedirectUrl").textContent = result.stripe_redirect_url || "";
                $("stripeUrl").textContent = result.stripe_hosted_url || "";

                $("result").classList.add("show");
                setLinkEnabled(Boolean(currentLongUrl));
                setStatus("生成完成。");
                generateButton.disabled = false;
              } else if (data.status === "error") {
                clearInterval(pollingInterval);
                pollingInterval = null;

                setStatus(`生成失败: ${data.error}`, true);
                generateButton.disabled = false;
              }
            } catch (error) {
              console.error("轮询错误:", error);
            }
          }, 1000); // 每秒轮询一次

        } catch (error) {
          currentLongUrl = "";
          setStatus(error instanceof Error ? error.message : String(error), true);
          generateButton.disabled = false;

          if (pollingInterval) {
            clearInterval(pollingInterval);
            pollingInterval = null;
          }
        }
      }

      function appendLog(message) {
        const logsContainer = $("logsContainer");
        const logLine = document.createElement("div");
        logLine.textContent = message;

        // 根据日志类型添加颜色
        if (message.includes("[Error]") || message.includes("[Fallback]")) {
          logLine.style.color = "#b42318";
        } else if (message.includes("[Success]") || message.includes("[Complete]")) {
          logLine.style.color = "#087443";
        } else if (message.includes("[Warning]")) {
          logLine.style.color = "#f79009";
        } else if (message.includes("[Polling]") || message.includes("[Redirect]")) {
          logLine.style.color = "#155eef";
        } else {
          logLine.style.color = "#475467";
        }

        logsContainer.appendChild(logLine);

        // 自动滚动到底部
        logsContainer.scrollTop = logsContainer.scrollHeight;
      }

      async function copyLink() {
        if (!currentLongUrl) return;
        await navigator.clipboard.writeText(currentLongUrl);
        setStatus("已复制。");
      }

      async function testApprovalProxy() {
        const proxyUrl = $("approvalProxy").value.trim();
        if (!proxyUrl) {
          setStatus("请先输入审批代理地址。", true);
          return;
        }

        const testButton = $("testApprovalProxy");
        testButton.disabled = true;
        testButton.textContent = "测试中...";
        setStatus("正在测试审批代理连接...");

        try {
          const response = await fetch("/api/test-proxy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proxy: proxyUrl }),
          });
          const data = await response.json();

          if (data.ok) {
            setStatus(`✓ 审批代理: ${data.message}`, false);
          } else {
            setStatus(`✗ 审批代理连接失败: ${data.error}`, true);
          }
        } catch (error) {
          setStatus(`✗ 审批代理测试失败: ${error.message}`, true);
        } finally {
          testButton.disabled = false;
          testButton.textContent = "测试代理";
        }
      }

      async function testPaymentProxy() {
        const proxyUrl = $("paymentProxy").value.trim();
        if (!proxyUrl) {
          setStatus("请先输入支付代理地址。", true);
          return;
        }

        const testButton = $("testPaymentProxy");
        testButton.disabled = true;
        testButton.textContent = "测试中...";
        setStatus("正在测试支付代理连接...");

        try {
          const response = await fetch("/api/test-proxy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proxy: proxyUrl }),
          });
          const data = await response.json();

          if (data.ok) {
            setStatus(`✓ 支付代理: ${data.message}`, false);
          } else {
            setStatus(`✗ 支付代理连接失败: ${data.error}`, true);
          }
        } catch (error) {
          setStatus(`✗ 支付代理测试失败: ${error.message}`, true);
        } finally {
          testButton.disabled = false;
          testButton.textContent = "测试代理";
        }
      }

      async function testCheckoutProxy() {
        const proxyUrl = $("checkoutProxy").value.trim();
        if (!proxyUrl) {
          setStatus("请先输入创建代理地址。", true);
          return;
        }

        const testButton = $("testCheckoutProxy");
        testButton.disabled = true;
        testButton.textContent = "测试中...";
        setStatus("正在测试创建代理连接...");

        try {
          const response = await fetch("/api/test-proxy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proxy: proxyUrl }),
          });
          const data = await response.json();

          if (data.ok) {
            setStatus(`✓ 创建代理: ${data.message}`, false);
          } else {
            setStatus(`✗ 创建代理连接失败: ${data.error}`, true);
          }
        } catch (error) {
          setStatus(`✗ 创建代理测试失败: ${error.message}`, true);
        } finally {
          testButton.disabled = false;
          testButton.textContent = "测试代理";
        }
      }

      fillCountries();
      updateLockedCountry();
      updateCurrency();
      loadProxy();
      $("accessToken").addEventListener("input", updateTokenMeta);
      $("linkType").addEventListener("change", updateLockedCountry);
      $("billingCountry").addEventListener("change", updateCurrency);
      $("saveProxy").addEventListener("click", () => {
        localStorage.setItem("openai_pay_checkout_proxy", $("checkoutProxy").value.trim());
        localStorage.setItem("openai_pay_approval_proxy", $("approvalProxy").value.trim());
        localStorage.setItem("openai_pay_payment_proxy", $("paymentProxy").value.trim());
        setStatus("代理已保存在本机浏览器。");
      });
      $("clearProxy").addEventListener("click", () => {
        localStorage.removeItem("openai_pay_checkout_proxy");
        localStorage.removeItem("openai_pay_approval_proxy");
        localStorage.removeItem("openai_pay_payment_proxy");
        $("checkoutProxy").value = "";
        $("approvalProxy").value = "";
        $("paymentProxy").value = "";
        setStatus("已清除保存的代理。");
      });
      $("testApprovalProxy").addEventListener("click", testApprovalProxy);
      $("testPaymentProxy").addEventListener("click", testPaymentProxy);
      $("testCheckoutProxy").addEventListener("click", testCheckoutProxy);
      generateButton.addEventListener("click", generate);
      copyButton.addEventListener("click", copyLink);
    </script>
  </body>
</html>
